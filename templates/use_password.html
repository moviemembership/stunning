<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Use Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .image-wrap {
            width: 100%;
            cursor: zoom-in;
        }

        .image-wrap img {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;
        }


        /* =========================
           ZOOM OVERLAY
        ========================== */

        .zoom-overlay {
            position: fixed;
            inset: 0;

            z-index: 99999;

            display: none;

            width: 100vw;
            height: 100vh;

            background: rgba(0, 0, 0, 0.97);

            overflow: auto;

            cursor: zoom-out;

            -webkit-overflow-scrolling: touch;
        }

        .zoom-overlay.active {
            display: flex;

            align-items: center;
            justify-content: center;
        }

        .zoom-overlay img {
            display: block;

            max-width: 100%;
            max-height: 100vh;

            width: auto;
            height: auto;

            object-fit: contain;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;
        }


        /* MOBILE */
        @media (max-width: 600px) {

            .zoom-overlay {
                align-items: flex-start;
            }

            .zoom-overlay img {
                width: auto;

                max-width: none;
                max-height: none;

                min-width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <!-- NORMAL IMAGE -->
    <div
        class="image-wrap"
        id="normalImage"
    >
        <img
            src="/test/usepassword.png"
            alt="Use Password Guide"
        >
    </div>


    <!-- ENLARGED IMAGE -->
    <div
        class="zoom-overlay"
        id="zoomOverlay"
    >
        <img
            src="/test/usepassword.png"
            alt="Use Password Guide Enlarged"
        >
    </div>


    <script>
        const normalImage =
            document.getElementById("normalImage");

        const zoomOverlay =
            document.getElementById("zoomOverlay");


        function openZoom() {
            zoomOverlay.classList.add("active");

            document.body.style.overflow =
                "hidden";
        }


        function closeZoom() {
            zoomOverlay.classList.remove("active");

            document.body.style.overflow =
                "";
        }


        normalImage.addEventListener(
            "click",
            openZoom
        );


        zoomOverlay.addEventListener(
            "click",
            closeZoom
        );
    </script>

</body>
</html>
